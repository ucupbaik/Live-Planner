<main class="w-full max-w-[480px] px-margin-mobile md:px-0 z-10">

<div class="bg-surface-container/40 backdrop-blur-3xl border border-transparent bg-clip-padding rounded-xl p-8 md:p-12 flex flex-col items-center text-center shadow-2xl relative overflow-hidden before:absolute before:inset-0 before:-z-10 before:p-[1px] before:bg-gradient-to-r before:from-primary before:via-tertiary before:to-secondary before:rounded-xl before:content-['']">

<h1 class="font-display-lg text-display-lg bg-clip-text text-transparent bg-gradient-to-r from-primary via-tertiary to-secondary mb-4 tracking-tight">
